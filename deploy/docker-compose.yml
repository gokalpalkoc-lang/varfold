# Hetzner deployment: app (API + static frontend) behind Caddy (automatic HTTPS).
#   cp .env.example .env && edit
#   mkdir -p data && copy varfold.sqlite into ./data (see publish.sh)
#   docker compose up -d --build
services:
  app:
    build: ../web
    restart: unless-stopped
    env_file: .env
    environment:
      VARFOLD_DB: /data/varfold.sqlite
    volumes:
      - ./data:/data:ro
    expose:
      - "8000"
    # The live worker lives on the tailnet (100.x.y.z). Containers reach it through
    # the host's tailscale0 route; if your setup can't, use `network_mode: host`.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
